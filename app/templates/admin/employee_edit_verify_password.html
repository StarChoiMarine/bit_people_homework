{% extends "base.html" %}

{% block title %}관리자 비밀번호 확인 | 직원 관리 시스템{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-2">관리자 비밀번호 확인</h1>
                <p class="text-secondary mb-4">
                    {{ employee.full_name }} 직원의 정보를 수정하려면
                    현재 로그인한 관리자의 비밀번호를 입력해 주세요.
                </p>
                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <form method="post"
                      action="/admin/employees/{{ employee.employee_number }}/edit/verify-password">
                    <div class="mb-4">
                        <label class="form-label" for="password">관리자 비밀번호</label>
                        <input class="form-control" id="password" name="password"
                               type="password" autocomplete="current-password" required autofocus>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a class="btn btn-outline-secondary"
                           href="/admin/employees/{{ employee.employee_number }}">취소</a>
                        <button class="btn btn-primary" type="submit">확인</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
