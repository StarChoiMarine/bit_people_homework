<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}직원 관리 시스템{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">비트컴퓨터 직원 포털</a>
            {% if current_user %}
            <div class="d-flex align-items-center gap-3 text-white">
                <span>{{ current_user.full_name }} ({{ current_user.role.value }})</span>
                <form method="post" action="/logout">
                    <button class="btn btn-outline-light btn-sm" type="submit">로그아웃</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
