{% extends "base.html" %}

{% block title %}비밀번호 확인 | 직원 관리 시스템{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-2">비밀번호 확인</h1>
                <p class="text-secondary mb-4">개인정보 수정을 위해 비밀번호를 다시 입력해 주세요.</p>
                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <form method="post" action="/employees/me/edit/verify-password">
                    <div class="mb-4">
                        <label class="form-label" for="password">비밀번호</label>
                        <input class="form-control" id="password" name="password"
                               type="password" autocomplete="current-password" required autofocus>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a class="btn btn-outline-secondary" href="/employees/me">취소</a>
                        <button class="btn btn-primary" type="submit">확인</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
