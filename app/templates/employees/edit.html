{% extends "base.html" %}

{% block title %}정보 변경 요청 | 직원 관리 시스템{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-2">정보 변경 요청</h1>
                <p class="text-secondary mb-4">관리자 승인 후 실제 직원 정보에 반영됩니다.</p>
                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <form method="post" action="/employees/me/edit">
                    <div class="mb-3">
                        <label class="form-label" for="full_name">성명</label>
                        <input class="form-control" id="full_name" readonly
                               value="{{ form_data.get('family_name', employee.family_name) }}{{ form_data.get('given_name', employee.given_name) }}">
                        <div class="form-text">성과 이름을 입력하면 자동으로 완성됩니다.</div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label" for="family_name">성</label>
                            <input class="form-control" id="family_name" name="family_name"
                                   maxlength="50"
                                   value="{{ form_data.get('family_name', employee.family_name) }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="given_name">이름</label>
                            <input class="form-control" id="given_name" name="given_name"
                                   maxlength="50"
                                   value="{{ form_data.get('given_name', employee.given_name) }}" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="date_of_birth">생년월일</label>
                        <input class="form-control" id="date_of_birth" name="date_of_birth"
                               type="date"
                               value="{{ form_data.get('date_of_birth', employee.date_of_birth or '') }}">
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a class="btn btn-outline-secondary" href="/employees/me">취소</a>
                        <button class="btn btn-primary" type="submit">변경 요청</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const familyNameInput = document.getElementById("family_name");
    const givenNameInput = document.getElementById("given_name");
    const fullNameInput = document.getElementById("full_name");

    function updateFullName() {
        fullNameInput.value = familyNameInput.value.trim() + givenNameInput.value.trim();
    }

    familyNameInput.addEventListener("input", updateFullName);
    givenNameInput.addEventListener("input", updateFullName);
</script>
{% endblock %}
