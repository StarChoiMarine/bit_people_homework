{% extends "base.html" %}

{% block title %}비밀번호 변경 | 직원 관리 시스템{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">비밀번호 변경</h1>
                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <form method="post" action="/employees/me/password">
                    <div class="mb-3">
                        <label class="form-label" for="current_password">현재 비밀번호</label>
                        <input class="form-control" id="current_password" name="current_password"
                               type="password" autocomplete="current-password" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="new_password">새 비밀번호</label>
                        <input class="form-control" id="new_password" name="new_password"
                               type="password" minlength="8" autocomplete="new-password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="new_password_confirmation">새 비밀번호 확인</label>
                        <input class="form-control" id="new_password_confirmation"
                               name="new_password_confirmation" type="password" minlength="8"
                               autocomplete="new-password" required>
                        <div class="form-text">8자 이상이며 특수문자를 포함해야 합니다.</div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a class="btn btn-outline-secondary" href="/employees/me">취소</a>
                        <button class="btn btn-primary" type="submit">비밀번호 변경</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
